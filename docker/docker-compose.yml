# ============================================================
# ⚠️ 已弃用 — 仅作参考
# ============================================================
# 本文件用于启动原 Express 后端 (apps/server) 依赖的 MySQL/Redis/MinIO。
# 自 2026-06 起，项目已迁移到 Supabase-only 架构，不再需要本地数据库。
# apps/server/ 目录保留为参考，但不再构建/运行。
#
# 当前项目的本地开发流程：
#   1. 在 https://supabase.com 创建项目
#   2. 在 Supabase SQL Editor 执行 supabase/schema.sql
#   3. cp apps/web/.env.example apps/web/.env.local，填入 VITE_SUPABASE_URL / ANON_KEY
#   4. cd apps/web && npm install && npm run dev
#
# 如需启动旧版本地数据库（仅供历史参考），可执行：
#   docker-compose -f docker/docker-compose.yml up -d
# ============================================================

version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: training-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: training_platform
      MYSQL_USER: training_user
      MYSQL_PASSWORD: training_pass
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: training-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  minio:
    image: minio/minio:latest
    container_name: training-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  mysql_data:
  redis_data:
  minio_data:
